[package]
name = "mvts"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "mvts"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "1.4.3", features = ["vtab-loadable", "vscalar"] }
duckdb-loadable-macros = "0.1.12"
libduckdb-sys = { version = "1.4.3", features = ["loadable-extension"] }
axum = { version = "0.8.7", features = ["json"] }
tokio = { version = "1.37", features = ["rt-multi-thread", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
anyhow = "1.0"
tera = "1.20.1"
log = "0.4"
simplelog = "0.12"
tower = { version = "0.5", features = ["limit"] }
