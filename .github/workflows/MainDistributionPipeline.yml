#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.0
    with:
      duckdb_version: v1.5.0
      ci_tools_version: v1.5.0
      extension_name: mvts
      extra_toolchains: rust;python3
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;linux_arm64;linux_amd64_musl'
      skip_tests: true

  deploy-gcs:
    name: Deploy to GCS
    needs: duckdb-stable-build
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/_extension_deploy.yml
    with:
      extension_name: mvts
      duckdb_version: v1.5.0
      ci_tools_version: v1.5.0
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;linux_arm64;linux_amd64_musl'
      deploy_latest: true
      deploy_versioned: true
    secrets: inherit
